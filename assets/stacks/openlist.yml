services:
  openlist:
    image: openlistteam/openlist:latest
    container_name: openlist
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    environment:
      TZ: America/Sao_Paulo
      UMASK: "022"
    volumes:
      # Configuração e banco de dados do OpenList
      - /srv/openlist/config:/opt/openlist/data
      # Suas mídias existentes (somente leitura, adicionar :ro se não quiser escrita)
      - /srv/midia:/midia
      # Para adicionar outra pasta, precisamos avisar o Docker primeiro
      # - /local/outra_pasta:/outra_pasta
    networks:
      - openlist-net
    ports:
      - "5244:5244"   # Web UI + WebDAV + API
      - "5245:5245"   # HTTPS interno (opcional, usado se TLS for habilitado no container)
    hostname: openlist

# Rede com nome próprio: sem o name:, o Compose cria "openlist_default", e na rede
# bridge padrão do Docker o container alcança os das outras stacks pelo IP.
networks:
  openlist-net:
    name: openlist-net
    driver: bridge

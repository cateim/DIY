# Overrides /usr/lib/tmpfiles.d/50-plymouth.conf (plymouth package), which adds
# the plymouth-shutdown hook to the mkinitcpio shutdown ramfs. On this Alienware
# 17 R3 that hook made every poweroff hang after systemd-shutdown (black screen,
# keyboard backlight on, only the power button cut it). Without it the ramfs
# still runs sd-shutdown and closes the LUKS root; tested 2026-11-22.
# Empty on purpose: the shutdown ramfs keeps only HOOKS=(sd-shutdown).

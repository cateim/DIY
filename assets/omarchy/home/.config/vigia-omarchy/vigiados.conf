# O que o ~/.local/bin/vigia-omarchy vigia. Uma linha por item: tipo|alvo|o que depende disso.
#   arquivo|<caminho>|...  guarda uma cópia e avisa (com diff) quando o arquivo muda ou some
#   pacote|<nome>|...      guarda a versão do pacote e avisa quando ela muda
# A terceira coluna é a personalização afetada e o que conferir. Sem barra vertical nela.
# Depois de mexer aqui, rode vigia-omarchy uma vez: item novo entra na base sem aviso.

# ---- Código do Omarchy copiado ou de que um ajuste depende ----
arquivo|/usr/share/omarchy/shell/plugins/panels/monitor/Panel.qml|monitors.lua, regra do LG por HDMI-A-4: ligar o LG pelo painel Display tem que voltar acima do notebook a 75 Hz
arquivo|/usr/share/omarchy/shell/Commons/Style.qml|plugins cateim.window-switcher e syncwatch (usam Style): conferir o Alt+Tab e o painel do Drive na barra
arquivo|/usr/share/omarchy/shell/Commons/Color.qml|plugins cateim.window-switcher e syncwatch (usam Commons.Color): conferir o Alt+Tab e a cor de alerta do ícone do Drive
arquivo|/usr/share/omarchy/shell/Ui/BorderSurface.qml|plugin cateim.window-switcher (usa BorderSurface): conferir o Alt+Tab
arquivo|/usr/share/omarchy/shell/Commons/Translations.qml|plugin syncwatch (lê i18n/ por ele): conferir se o painel do Drive ainda mostra os textos e não as chaves
arquivo|/usr/share/omarchy/shell/Ui/Panel.qml|plugin syncwatch (é um Panel): clicar no ícone do Drive na barra e conferir que o painel abre
arquivo|/usr/share/omarchy/shell/Ui/KeyboardPanel.qml|plugin syncwatch (painel do ícone): conferir que abre, fecha com Esc e aceita S, P, W, O, R e ? (a lista de teclas)
arquivo|/usr/share/omarchy/shell/Ui/BarIconButton.qml|plugin syncwatch (ícone na barra, clique direito sincroniza, do meio abre o ~/Drive): conferir os três cliques
arquivo|/usr/share/omarchy/shell/Ui/PanelHero.qml|plugin syncwatch (cabeçalho do painel): conferir o título e a frase de estado
arquivo|/usr/share/omarchy/shell/Ui/PanelActionButton.qml|plugin syncwatch (botões sincronizar, pausar, SyncWatch e pasta): conferir os quatro e a dica de cada um
arquivo|/usr/share/omarchy/shell/services/PluginRegistry.qml|widget do SyncWatch: o pacote não escreve na home, então ele entra por um link em ~/.config/omarchy/plugins, e o scan "$dir"/*/ daqui segue esse link: conferir que a nuvem continua na barra
arquivo|/usr/bin/omarchy-launch-screensaver|vnc-sessao liga o interruptor screensaver-off durante o VNC: conferir se o lançador ainda não abre o protetor com ele ligado
arquivo|/usr/share/omarchy/shell/plugins/services/idle/Service.qml|vnc-sessao: com o protetor sem abrir, o bloqueio dos 30 min tem que continuar valendo pelo VNC
arquivo|/usr/share/omarchy/default/themed/chromium.theme.tpl|~/.config/omarchy/themed/chromium.theme.tpl é cópia dele: levar a mudança para a cópia

# ---- Modelos de onde saíram os seus arquivos (as migrações costumam levar o que importa) ----
arquivo|/usr/share/omarchy/config/hypr/bindings.lua|~/.config/hypr/bindings.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/hyprland.lua|~/.config/hypr/hyprland.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/input.lua|~/.config/hypr/input.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/monitors.lua|~/.config/hypr/monitors.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/omarchy/shell.json|~/.config/omarchy/shell.json: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/kitty/kitty.conf|~/.config/kitty/kitty.conf: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/starship.toml|~/.config/starship.toml (prompt próprio): ver se vale trazer a mudança
arquivo|/usr/share/omarchy/config/git/config|~/.config/git/config: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/chromium-flags.conf|~/.config/chromium-flags.conf e chrome-flags.conf: ver se a mudança chegou aos dois
arquivo|/usr/share/omarchy/default/applications/mimeapps.list|~/.config/mimeapps.list: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/default/bashrc|~/.bashrc: ver se a mudança chegou ao seu arquivo
arquivo|/etc/mise/conf.d/omarchy-tools.toml|desde a 4.5 node, claude, codex e gh vêm daqui e não do ~/.config/mise/config.toml: conferir se node segue declarado

# ---- Pacotes de cujo comportamento um ajuste depende ----
arquivo|/usr/lib/systemd/system/rustdesk.service|drop-in /etc/systemd/system/rustdesk.service.d/sessao.conf: conferir se ainda se aplica
pacote|rustdesk|rustdesk-tela-unica (lê create_relay requested e Connection opened no log) e o mouse remoto: fazer uma sessão pelo CortenDesk e conferir o journal e o mouse
pacote|hyprland|monitors.lua e o hl.monitor do rustdesk-tela-unica, Alt+Tab (submap no bindings.lua), igualar-janelas.lua (layoutmsg splitratio do dwindle), open-history.sh do syncwatch (hyprctl clients -j e hl.dsp.focus para focar o syncwatch): conferir o LG pelo painel, o Alt+Tab, o SUPER + SHIFT + J com 3 janelas e o L do ícone do Drive com o syncwatch já aberto
pacote|xdg-desktop-portal-hyprland|eDP-1 em 0x0 porque o portal informa toda tela em (0,0) (rustdesk#15731): ver se mudou e se a origem pode voltar
pacote|quickshell|plugins cateim.keyboard-layout, cateim.window-switcher e syncwatch: conferir a barra, o Alt+Tab e o painel do Drive
pacote|wayvnc|wayvnc.service, o teclado brvnc (CapsLock como SUPER) e o vnc-sessao (wayvncctl event-receive e client-list): testar uma sessão VNC, o LG tem que desligar
pacote|rclone|syncwatch run (rclone bisync no ~/Drive, pelo drive-sync.service do pacote do SyncWatch): conferir a próxima execução em ~/.local/state/drive-sync.log; o SyncWatch lê desse log a linha "INFO  : Bisync successful" e as linhas ERROR, então conferir que o ícone volta ao check depois da rodada
pacote|nautilus|icones-pastas (metadata::custom-icon do gvfs): abrir ~/Drive/GitHub depois de nautilus -q e conferir se as pastas seguem com o ícone próprio
arquivo|/usr/share/omarchy/bin/omarchy-notification-dismiss|syncwatch notify e syncwatch watchdog tiram da tela o aviso crítico por ele quando o problema acaba: parar o drive-sync.timer, rodar o drive-sync-watchdog.service, religar, rodar de novo e conferir que o cartão some

# O que o ~/.local/bin/vigia-omarchy vigia. Uma linha por item: tipo|alvo|o que depende disso.
#   arquivo|<caminho>|...  guarda uma cópia e avisa (com diff) quando o arquivo muda ou some
#   pacote|<nome>|...      guarda a versão do pacote e avisa quando ela muda
# A terceira coluna é a personalização afetada e o que conferir. Sem barra vertical nela.
# Depois de mexer aqui, rode vigia-omarchy uma vez: item novo entra na base sem aviso.

# ---- Código do Omarchy copiado ou de que um ajuste depende ----
arquivo|/usr/share/omarchy/shell/plugins/panels/monitor/Panel.qml|monitors.lua, regra do LG por HDMI-A-4: ligar o LG pelo painel Display tem que voltar acima do notebook a 75 Hz
arquivo|/usr/share/omarchy/shell/Commons/Style.qml|plugin cateim.window-switcher (usa Style): conferir o Alt+Tab
arquivo|/usr/share/omarchy/shell/Commons/Color.qml|plugin cateim.window-switcher (usa Commons.Color): conferir o Alt+Tab
arquivo|/usr/share/omarchy/shell/Ui/BorderSurface.qml|plugin cateim.window-switcher (usa BorderSurface): conferir o Alt+Tab
arquivo|/usr/share/omarchy/default/themed/chromium.theme.tpl|~/.config/omarchy/themed/chromium.theme.tpl é cópia dele: levar a mudança para a cópia

# ---- Modelos de onde saíram os seus arquivos (as migrações costumam levar o que importa) ----
arquivo|/usr/share/omarchy/config/hypr/bindings.lua|~/.config/hypr/bindings.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/hyprland.lua|~/.config/hypr/hyprland.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/input.lua|~/.config/hypr/input.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/hypr/monitors.lua|~/.config/hypr/monitors.lua: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/omarchy/shell.json|~/.config/omarchy/shell.json: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/kitty/kitty.conf|~/.config/kitty/kitty.conf: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/starship.toml|~/.config/starship.toml (prompt próprio): ver se vale trazer a mudança
arquivo|/usr/share/omarchy/config/git/config|~/.config/git/config: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/config/chromium-flags.conf|~/.config/chromium-flags.conf e chrome-flags.conf: ver se a mudança chegou aos dois
arquivo|/usr/share/omarchy/default/applications/mimeapps.list|~/.config/mimeapps.list: ver se a mudança chegou ao seu arquivo
arquivo|/usr/share/omarchy/default/bashrc|~/.bashrc: ver se a mudança chegou ao seu arquivo
arquivo|/etc/mise/conf.d/omarchy-tools.toml|desde a 4.5 node, claude, codex e gh vêm daqui e não do ~/.config/mise/config.toml: conferir se node segue declarado

# ---- Pacotes de cujo comportamento um ajuste depende ----
arquivo|/usr/lib/systemd/system/rustdesk.service|drop-in /etc/systemd/system/rustdesk.service.d/sessao.conf: conferir se ainda se aplica
pacote|rustdesk|rustdesk-tela-unica (lê create_relay requested e Connection opened no log) e o mouse remoto: fazer uma sessão pelo CortenDesk e conferir o journal e o mouse
pacote|hyprland|monitors.lua e o hl.monitor do rustdesk-tela-unica, Alt+Tab (submap no bindings.lua): conferir o LG pelo painel e o Alt+Tab
pacote|xdg-desktop-portal-hyprland|eDP-1 em 0x0 porque o portal informa toda tela em (0,0) (rustdesk#15731): ver se mudou e se a origem pode voltar
pacote|quickshell|plugins cateim.keyboard-layout e cateim.window-switcher: conferir a barra e o Alt+Tab
pacote|wayvnc|wayvnc.service e o teclado brvnc (CapsLock como SUPER): testar uma sessão VNC
pacote|rclone|drive-sync.sh (rclone bisync no ~/Drive): conferir a próxima execução em ~/.local/state/drive-sync.log

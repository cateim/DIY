add_newline = true
command_timeout = 200
format = """
[$username$hostname$directory$git_branch$git_status]($style)\
$package\
$c\
$nodejs\
$golang\
$rust\
$ruby\
$python\
$docker_context\
$aws\
$memory_usage\
$battery\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

# user@host always visible (Starship default shows them only over SSH / as root)
[username]
show_always = true
format = "[$user]($style)"
# Fixed hex colors: theme ANSI names get remapped (Hackerman's "red" is green)
style_user = "#5fd75f"
style_root = "#ff4444"

[hostname]
ssh_only = false
format = "@[$hostname]($style) "
style = "#ff4444"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
# Light sky blue (256-color 39 = #00afff), same as folders on <<VPS_NAME>>
style = "bold #00afff"
repo_root_style = "bold #00afff"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[memory_usage]
# Same [🐏 78%] as the <<HOMELAB_NAME>> homelab; threshold -1 = always visible (homelab hides it below 50%)
disabled = false
threshold = -1
symbol = "🐏 "
format = "\\[[$symbol$ram_pct]($style)\\]"
style = "bold #ffffff"

# Project version (package.json, Cargo.toml, pyproject.toml...). Not on the homelab.
# display_private: most of my apps are "private": true in package.json and would be hidden
[package]
symbol = "📦 "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #ff8700"
display_private = true

# ---- Languages, docker, aws and duration: same symbols and [..] blocks as the <<HOMELAB_NAME>> homelab ----
[c]
symbol = "⚙️ "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #5f87ff"

[nodejs]
symbol = "🦊 "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #5fd75f"

[golang]
symbol = "🐹 "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #00d7d7"

[rust]
symbol = "🦀 "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #ff4444"

[ruby]
symbol = "💎 "
format = "\\[[$symbol$version]($style)\\]"
style = "bold #ff4444"

[python]
symbol = "🐍 "
# Active venv in parentheses: the `prompt` key of pyvenv.cfg when set, else the venv folder name
format = "\\[[$symbol$version( \\($virtualenv\\))]($style)\\]"
style = "bold #ffd75f"

[docker_context]
symbol = "🐳 "
format = "\\[[$symbol$context]($style)\\]"
style = "bold #2496ed"

[aws]
symbol = "☁️ "
format = "\\[[$symbol($profile )(\\($region\\))]($style)\\]"
style = "bold #ffaf00"

# Shows only when the last command took 2s or more (Starship default min_time)
[cmd_duration]
format = "\\[[⏱ $duration]($style)\\]"
style = "bold #ffd75f"

# ---- Notebook-only extras (not on the homelab) ----
# Battery: hidden above 30%, red at 15% or less
[battery]
format = "\\[[$symbol$percentage]($style)\\]"
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "🔋 "
empty_symbol = "🪫 "
unknown_symbol = "🔋 "

[[battery.display]]
threshold = 15
style = "bold #ff4444"

[[battery.display]]
threshold = 30
style = "bold #ffaf00"

# Background jobs (Ctrl+Z or &), count always shown
[jobs]
symbol = "✦ "
number_threshold = 1
format = "\\[[$symbol$number]($style)\\]"
style = "bold #00afff"

# Exit code of the last command when it failed
[status]
disabled = false
symbol = "✗ "
format = "\\[[$symbol$status]($style)\\]"
style = "bold #ff4444"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
